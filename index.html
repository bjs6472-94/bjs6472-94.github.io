<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 스튜디오</title>
<meta name="description" content="직접 만든 모바일 게임 모음.">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    color:#223;background:#eef4fb;line-height:1.6}
  .hero{background:linear-gradient(135deg,#5c6fb1,#405296);color:#fff;
    padding:56px 20px;text-align:center}
  h1{margin:0 0 6px;font-size:30px}
  .sub{opacity:.9}
  .wrap{max-width:720px;margin:0 auto;padding:36px 20px}
  .game{display:flex;align-items:center;gap:18px;background:#fff;border-radius:16px;
    padding:20px;margin:14px 0;box-shadow:0 6px 20px rgba(58,82,128,.08);
    text-decoration:none;color:inherit;transition:transform .12s}
  .game:hover{transform:translateY(-2px)}
  .gi{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#9fc3ea,#4a7fc0);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
    font-size:12px;letter-spacing:1px;flex:0 0 auto}
  .gt{font-size:18px;font-weight:700}
  .gd{font-size:13.5px;color:#5a6b8c}
  .arrow{margin-left:auto;color:#9aa8c6;font-size:22px}
  footer{text-align:center;color:#5a6b8c;font-size:13px;padding:28px 20px 50px}
</style>
</head>
<body>
  <div class="hero">
    <h1>게임 스튜디오</h1>
    <div class="sub">직접 만든 모바일 게임 모음</div>
  </div>

  <div class="wrap">
    <!-- 게임이 늘어나면 아래 <a class="game"> 블록만 복사해서 추가하세요 -->
    <a class="game" href="./sudoku9/index.html">
      <div class="gi">SUDOKU</div>
      <div>
        <div class="gt">스도쿠 9</div>
        <div class="gd">4단계 난이도의 무료 숫자 퍼즐 게임</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <footer>© 2026 게임 스튜디오. All rights reserved. · <a href="mailto:bjs6472@naver.com" style="color:#5a6b8c">bjs6472@naver.com</a></footer>
</body>
</html>
